name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: vindu-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub release
  id-token: write # sign the provenance attestation
  attestations: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Validate release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vX.Y.Z" >&2
            exit 1
          fi
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is required" >&2
            exit 1
          fi
          EXISTING_RELEASE_ID="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | .id'
          )"
          if [[ -n "$EXISTING_RELEASE_ID" ]]; then
            echo "release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi

          REMOTE_TAG_COMMIT="$(
            git ls-remote origin \
              "refs/tags/${GITHUB_REF_NAME}" \
              "refs/tags/${GITHUB_REF_NAME}^{}" \
              | awk '
                  $2 ~ /\^\{\}$/ { peeled = $1 }
                  $2 !~ /\^\{\}$/ { direct = $1 }
                  END { if (peeled != "") print peeled; else print direct }
                '
          )"
          if [[ "$REMOTE_TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "remote tag does not point at workflow commit $GITHUB_SHA" >&2
            exit 1
          fi

      # actions/checkout v6
      - name: Checkout Homebrew tap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: yarlson/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false

      # Per-triple builds + lipo: works with any Swift toolchain, unlike
      # `swift build --arch a --arch b`, which requires Xcode's xcbuild.
      - name: Build universal binaries
        run: |
          set -euo pipefail
          swift build -c release --triple arm64-apple-macosx
          swift build -c release --triple x86_64-apple-macosx
          mkdir -p dist/vindu
          for bin in vindud vinductl; do
            lipo -create \
              ".build/arm64-apple-macosx/release/$bin" \
              ".build/x86_64-apple-macosx/release/$bin" \
              -output "dist/vindu/$bin"
          done

      - name: Ad-hoc sign binaries
        run: |
          set -euo pipefail
          for bin in vindud vinductl; do
            codesign --force --sign - "dist/vindu/$bin"
          done

      - name: Smoke test
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          VINDUD_VERSION="$(dist/vindu/vindud --version)"
          VINDUCTL_VERSION="$(dist/vindu/vinductl --version)"

          for bin in vindud vinductl; do
            lipo -archs "dist/vindu/$bin" | grep -q "x86_64 arm64"
            codesign --verify --strict --verbose=2 "dist/vindu/$bin"
          done
          printf '%s\n' "$VINDUD_VERSION" "$VINDUCTL_VERSION"
          test "$VINDUD_VERSION" = "vindu $VERSION"
          test "$VINDUCTL_VERSION" = "vinductl $VERSION"

      - name: Package ZIP
        run: |
          set -euo pipefail
          cp README.md examples/vindu.conf dist/vindu/
          ARTIFACT="vindu-${GITHUB_REF_NAME}-macos-universal.zip"
          ditto -c -k --keepParent dist/vindu "$ARTIFACT"
          shasum -a 256 "$ARTIFACT" > checksums.txt

      - name: Prepare Homebrew formula
        run: |
          set -euo pipefail
          SHA="$(awk 'NR == 1 { print $1 }' checksums.txt)"
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "invalid release checksum" >&2
            exit 1
          fi

          sed -e "s/__TAG__/${GITHUB_REF_NAME}/g" \
              -e "s/__VERSION__/${VERSION}/g" \
              -e "s/__SHA256__/${SHA}/g" \
              packaging/vindu.rb.tmpl > tap/Formula/vindu.rb
          ruby -c tap/Formula/vindu.rb
          cd tap
          brew style --only-cops FormulaAudit Formula/vindu.rb

      - name: Revalidate release target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING_RELEASE_ID="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | .id'
          )"
          if [[ -n "$EXISTING_RELEASE_ID" ]]; then
            echo "release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi

          REMOTE_TAG_COMMIT="$(
            git ls-remote origin \
              "refs/tags/${GITHUB_REF_NAME}" \
              "refs/tags/${GITHUB_REF_NAME}^{}" \
              | awk '
                  $2 ~ /\^\{\}$/ { peeled = $1 }
                  $2 !~ /\^\{\}$/ { direct = $1 }
                  END { if (peeled != "") print peeled; else print direct }
                '
          )"
          if [[ "$REMOTE_TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "remote tag does not point at workflow commit $GITHUB_SHA" >&2
            exit 1
          fi

      # Cryptographic link between the ZIP and this exact workflow run;
      # verifiable with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v4
        with:
          subject-path: vindu-*.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE_TAG_COMMIT="$(
            git ls-remote origin \
              "refs/tags/${GITHUB_REF_NAME}" \
              "refs/tags/${GITHUB_REF_NAME}^{}" \
              | awk '
                  $2 ~ /\^\{\}$/ { peeled = $1 }
                  $2 !~ /\^\{\}$/ { direct = $1 }
                  END { if (peeled != "") print peeled; else print direct }
                '
          )"
          if [[ "$REMOTE_TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "remote tag does not point at workflow commit $GITHUB_SHA" >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --fail-on-no-commits \
            --title "vindu $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Ad-hoc signed macOS universal binaries." \
            vindu-*.zip checksums.txt

      # The published asset must round-trip before the formula points at it:
      # download from the release URL, verify the checksum, run the binaries.
      - name: Verify published artifact
        run: |
          set -euo pipefail
          mkdir verify && cd verify
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            --retry-max-time 60 -o release.zip \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/vindu-${GITHUB_REF_NAME}-macos-universal.zip"
          echo "$(awk '{print $1}' ../checksums.txt)  release.zip" | shasum -a 256 -c -
          unzip -q release.zip

          VERSION="${GITHUB_REF_NAME#v}"
          VINDUD_VERSION="$(vindu/vindud --version)"
          VINDUCTL_VERSION="$(vindu/vinductl --version)"
          for bin in vindud vinductl; do
            lipo -archs "vindu/$bin" | grep -q "x86_64 arm64"
            codesign --verify --strict --verbose=2 "vindu/$bin"
          done
          printf '%s\n' "$VINDUD_VERSION" "$VINDUCTL_VERSION"
          test "$VINDUD_VERSION" = "vindu $VERSION"
          test "$VINDUCTL_VERSION" = "vinductl $VERSION"

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vindu.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already matches $GITHUB_REF_NAME"
            exit 0
          fi
          git commit -m "vindu ${GITHUB_REF_NAME}"

          AUTH="$(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git push https://github.com/yarlson/homebrew-tap.git HEAD:main
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 AUTH

          if grep -Fq -- "$HOMEBREW_TAP_TOKEN" .git/config; then
            echo "tap token persisted in git config" >&2
            exit 1
          fi
